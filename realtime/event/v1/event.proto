syntax = "proto3";
package kratos.api;

option go_package = "github.com/go-saas/kit/realtime/event/v1;v1";

enum NotificationLevel{
  INFO = 0;
  WARNING=1000;
  ERROR=2000;
}

message NotificationEvent{
  string tenant_id=2;
  string group=3;
  string title=4;
  string desc=5;
  string image=7;
  string link=8;
  string source=9;
  repeated string user_ids=10;
  NotificationLevel level=12;
}